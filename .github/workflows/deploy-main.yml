name: Deploy to cloudtype

on:
  push:
    branches:
      - main
  schedule:
    - cron: '0 0 * * *'  # 매일 오전 9시 (KST = UTC+9, 0시 UTC)

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Deploy
        uses: cloudtype-github-actions/deploy@v1
        with:
          token: ${{ secrets.CLOUDTYPE_TOKEN }}
          project: rumanesystem/lumane-cloudtype
          stage: main
          yaml: >
            name: lumane-cloudtype

            app: node@24

            options:
              ports: "3001"
              env:
                - name: ADMIN_TOKEN
                  value: ${{ secrets.ADMIN_TOKEN }}
                - name: ANTHROPIC_API_KEY
                  value: ${{ secrets.ANTHROPIC_API_KEY }}
                - name: NOTION_TOKEN
                  value: ${{ secrets.NOTION_TOKEN }}
                - name: SUPABASE_SECRET_KEY
                  value: ${{ secrets.SUPABASE_SECRET_KEY }}
                - name: SUPABASE_URL
                  value: ${{ secrets.SUPABASE_URL }}
              buildenv: []
              healthz: /api/health
            context:
              git:
                url: https://github.com/${{ github.repository }}.git
                ref: ${{ github.ref }}
